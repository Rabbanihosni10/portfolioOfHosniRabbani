<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills | Hosni Rabbani</title>

</head>
<body>
    <header>
        <a href="index.html" class="logo">Rabbani</a>
        <div class="fas fa-bars" id="menu-icon"></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="education.html">Education</a>
            <a href="skills.html" class="active">Skills</a>
            <a href="experiences.html">Experiences</a>

    <section class="skills">
        <h2 class="section-title">My <span>Skills</span></h2>
        <div class="skills-container">
            <div class="skill-box reveal-on-scroll">
                <h3>Frontend Development</h3>
                <div class="skill-bar">
                    <div class="skill-info"><span>HTML & CSS</span><span>90%</span></div>
                    <div class="progress-line"><span style="width: 90%"></span></div>
                </div>

                    <div class="skill-info"><span>JavaScript & TypeScript</span><span>85%</span></div>
                    <div class="progress-line"><span style="width: 85%"></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info"><span>React & Next.js</span><span>80%</span></div>
                    <div class="progress-line"><span style="width: 80%"></span></div>
                </div>
            </div>

            <div class="skill-box reveal-on-scroll">
                <h3>Backend & Database</h3>
                <div class="skill-bar">
                    <div class="skill-info"><span>Node.js & Express</span><span>80%</span></div>
                    <div class="progress-line"><span style="width: 80%"></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info"><span>PostgreSQL & MongoDB</span><span>75%</span></div>
                    <div class="progress-line"><span style="width: 75%"></span></div>
                </div>
            </div>

            <div class="skill-box reveal-on-scroll">
                <h3>Tools & Others</h3>
                <div class="skill-bar">
                    <div class="skill-info"><span>Git & GitHub</span><span>85%</span></div>
                    <div class="progress-line"><span style="width: 85%"></span></div>
                </div>
                <div class="skill-bar">
                    <div class="skill-info"><span>Python & AI Basics</span><span>70%</span></div>
                    <div class="progress-line"><span style="width: 70%"></span></div>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>

</html>
